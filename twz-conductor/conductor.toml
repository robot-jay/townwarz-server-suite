network = "twz_net"
project = "townwarz"

[nats]
image = "nats:alpine"
name  = "twz-nats"
port  = 4222

[gateway]
image = "twz-gateway:local"
name  = "twz-gateway"
env = ["RUST_LOG=info", "NATS_URL=nats://twz-nats:4222", "HTTP_PORT=8080"]
port = 8080

[[cellservers]]
image = "twz-cellserver:local"
name  = "twz-cell-A"
env = ["RUST_LOG=info", "NATS_URL=nats://twz-nats:4222", "HTTP_PORT=3001", "CELL_ID=A"]
port = 3001
args  = ["--id","A"]

[[cellservers]]
image = "twz-cellserver:local"
name  = "twz-cell-B"
env = ["RUST_LOG=info", "NATS_URL=nats://twz-nats:4222", "HTTP_PORT=3002", "CELL_ID=B"]
port = 3002
args  = ["--id","B"]