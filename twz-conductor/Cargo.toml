[package]
name = "twz-conductor"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
twz-shared = { path = "../twz-shared" }
clap = { version = "4.5", features = ["derive"] }