[package]
name = "twz-conductor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["macros","rt-multi-thread","net","time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Async NATS client (v0.42). JetStream is built-in in this version.
async-nats = "0.42"
bytes = "1"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
nanoid = "0.4"
url = "2.5"

bollard = "0.16"
toml = "0.8"

# Link to your workspace crate
twz-shared = { path = "../twz-shared" }
tokio-postgres = "0.7"
dotenvy = "0.15"
