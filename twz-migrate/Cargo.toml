[package]
name = "twz-migrate"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
sea-orm = { version = "1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
twz-schema = { path = "../twz-schema" }

[dev-dependencies]
serde_json = "1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
